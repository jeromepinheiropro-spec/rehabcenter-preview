b_room_10-300x225.jpeg`,intro:"Pour les patients à mobilité réduite, nous assurons des séances de kinésithérapie directement à votre domicile, avec la même exigence qu'au cabinet.",indications:["Mobilité réduite","Suites d'hospitalisation","Personnes âgées","Rééducation post-opératoire","Pathologies chroniques","Récupération de l'autonomie"],approche:[["Prise de contact","Évaluation de vos besoins et organisation des séances."],["Séance à domicile","Soins personnalisés dans votre environnement."],["Progression","Exercices adaptés à votre cadre de vie."],["Continuité","Relais possible au cabinet dès que possible."]],tech:["Thérapie manuelle","Renforcement adapté","Rééducation à la marche","Conseils autonomie"],faq:[["Quelle zone ?","La région d'Esch-sur-Alzette et ses environs."],["Est-ce conventionné ?","Oui, dans les conditions de prise en charge de la CNS."]]},{slug:"kine-vestibulaire",tag:"Spécialisé",title:"Kiné vestibulaire",tagline:"En finir avec les vertiges et les troubles de l'équilibre.",img:`${b}/2024/06/rehab_room_13-300x225.jpeg`,intro:"La kinésithérapie vestibulaire traite les vertiges, le VPPB (vertige positionnel paroxystique bénin), les instabilités et les troubles de l'équilibre. Grâce à des manœuvres spécifiques et à une rééducation progressive, la plupart des patients constatent une amélioration dès les premières séances.",indications:["VPPB (vertige positionnel)","Névrite vestibulaire","Maladie de Ménière","Instabilité chronique & sensation d'ébriété","Vertiges après traumatisme crânien","Cinétose (mal des transports)"],approche:[["Bilan vestibulaire","Identification du type de vertige : tests positionnels, oculomoteurs et d'équilibre."],["Manœuvres libératoires","Manœuvres spécifiques (type Epley/Semont) : souvent efficaces en 1 à 3 séances pour le VPPB."],["Rééducation de l'équilibre","Exercices de stabilisation du regard, habituation et reprogrammation posturale."],["Prévention des récidives","Auto-exercices et conseils pour gérer une éventuelle récidive."]],tech:["Manœuvres libératoires","Rééducation oculomotrice","Plateforme d'équilibre","Exercices d'habituation"],faq:[["Combien de séances pour un VPPB ?","Le VPPB répond souvent en 1 à 3 séances de manœuvres. Les instabilités chroniques demandent une rééducation plus progressive."],["Faut-il un diagnostic ORL ?","Un avis médical (généraliste ou ORL) est recommandé ; nous travaillons en coordination avec votre médecin."]]},{slug:"kine-perineale",tag:"Spécialisé",title:"Kiné périnéale",tagline:"Rééducation du périnée, pour elle et pour lui.",img:`${b}/2024/06/rehab_room_11-300x225.jpeg`,intro:"La rééducation périnéale renforce le plancher pelvien après un accouchement, une chirurgie ou en cas d'incontinence. Une prise en charge discrète, respectueuse et efficace, pour les femmes comme pour les hommes.",indications:["Rééducation post-partum","Incontinence urinaire d'effort","Urgenturies & impériosités","Descente d'organes (prolapsus)","Suites de chirurgie prostatique","Douleurs pelviennes"],approche:[["Bilan périnéal","Entretien confidentiel et évaluation douce de la musculature du plancher pelvien."],["Prise de conscience","Apprentissage du verrouillage périnéal et de la respiration abdominale."],["Renforcement guidé","Exercices progressifs, biofeedback et travail fonctionnel."],["Intégration au quotidien","Transfert vers les gestes de la vie courante, le sport et le port de charges."]],tech:["Biofeedback","Exercices hypopressifs","Renforcement du plancher pelvien","Éducation thérapeutique"],faq:[["Quand commencer après un accouchement ?","Généralement 6 à 8 semaines après l'accouchement, après la visite post-natale."],["Est-ce pris en charge ?","Oui, sur prescription médicale, selon les conditions de la CNS."]]},{slug:"kine-de-la-main",tag:"Spécialisé",title:"Kiné de la main",tagline:"Redonner force et précision à vos mains.",img:`${b}/2024/06/rehab_machine_1-300x225.jpeg`,intro:"La rééducation de la main et du poignet exige une précision particulière : fractures, tendons, tunnel carpien ou doigts raides. Nous restaurons la mobilité fine, la force de préhension et la fonction au quotidien.",indications:["Fractures du poignet & des doigts","Suites de chirurgie du canal carpien","Lésions des tendons fléchisseurs/extenseurs","Entorses des doigts & du pouce","Maladie de Dupuytren (post-op)","Raideurs & algodystrophie"],approche:[["Bilan de la main","Mesure des amplitudes, de la force de préhension et de la sensibilité."],["Mobilisation précoce","Techniques douces pour prévenir raideurs et adhérences."],["Renforcement fin","Travail de la préhension, de la dextérité et de la coordination."],["Reprise fonctionnelle","Gestes professionnels, sport et activités du quotidien."]],tech:["Mobilisations spécifiques","Renforcement de préhension","Travail sensitif","Lutte anti-œdème"],faq:[["Après une chirurgie, quand commencer ?","Selon le protocole du chirurgien : souvent très tôt pour éviter les raideurs."],["Traitez-vous les musiciens et métiers manuels ?","Oui, la rééducation est adaptée aux exigences fines de votre activité."]]},{slug:"therapie-manuelle",tag:"Au cabinet",title:"Thérapie manuelle",tagline:"Des mains expertes contre la douleur.",img:`${b}/2024/06/kine_at_work_1-300x225.jpeg`,intro:"La thérapie manuelle regroupe des techniques spécifiques de mobilisation des articulations, des muscles et des tissus : une approche précise et fondée sur les preuves pour traiter la douleur et restaurer le mouvement.",indications:["Cervicalgies & torticolis","Lombalgies aiguës et chroniques","Blocages articulaires","Céphalées de tension","Douleurs de l'épaule & de la hanche","Troubles temporo-mandibulaires (mâchoire)"],approche:[["Diagnostic kiné","Examen articulaire et musculaire précis pour cibler la structure en cause."],["Techniques manuelles","Mobilisations, techniques myotensives et tissulaires adaptées."],["Réactivation","Exercices ciblés pour consolider le gain de mobilité."],["Prévention","Correction des facteurs d'entretien : posture, gestes, charge de travail."]],tech:["Mobilisations articulaires","Techniques myotensives","Cupping","Dry needling*"],faq:[["Est-ce douloureux ?","Les techniques sont graduées et toujours adaptées à votre tolérance."],["Thérapie manuelle ou ostéopathie ?","La thérapie manuelle kiné s'appuie sur un bilan fonctionnel et s'intègre à un programme de rééducation complet, remboursé CNS."]]},{slug:"kine-geriatrique",tag:"Spécialisé",title:"Kiné gériatrique",tagline:"Préserver l'autonomie, prévenir les chutes.",img:`${b}/2024/06/rehab_room_10-300x225.jpeg`,intro:"La kinésithérapie gériatrique aide les seniors à conserver mobilité, force et équilibre. Objectif : prévenir les chutes, maintenir l'autonomie et la qualité de vie, au cabinet ou à domicile.",indications:["Prévention des chutes","Reconditionnement après hospitalisation","Arthrose & douleurs chroniques","Troubles de la marche & de l'équilibre","Ostéoporose","Maintien de l'autonomie"],approche:[["Bilan gériatrique","Évaluation de la marche, de l'équilibre, de la force et du risque de chute."],["Programme adapté","Exercices sécurisés et progressifs, adaptés à votre condition."],["Équilibre & marche","Travail spécifique de la stabilité et de la confiance à la marche."],["Suivi au long cours","Maintien des acquis, coordination avec la famille et les soignants."]],tech:["Parcours de marche","Renforcement doux","Travail de l'équilibre","Séances à domicile possibles"],faq:[["À quel âge consulter ?","Dès que la marche, l'équilibre ou la force déclinent : mieux vaut prévenir que chuter."],["Les séances existent-elles à domicile ?","Oui, à Esch-sur-Alzette et environs, sur prescription."]]},{slug:"laboratoire-ketterthill",tag:"Partenaires",title:"Laboratoire Ketterthill",tagline:"Vos prises de sang, directement dans nos locaux.",img:`${b}/2024/06/rehab_salle_attente-1024x577.jpeg`,intro:"En partenariat avec les Laboratoires Ketterthill, un service de prélèvements sanguins est proposé directement au sein du Rehab Center : gagnez du temps en combinant vos analyses et votre séance de kiné, au même endroit.",indications:["Prises de sang & bilans sanguins","Analyses sur prescription médicale","Suivi biologique régulier","Bilans sportifs","Résultats transmis à votre médecin","Sans détour par le laboratoire"],approche:[["Prescription","Munissez-vous de votre ordonnance d'analyses."],["Rendez-vous sur place","Le prélèvement est réalisé dans nos locaux, en toute confidentialité."],["Analyse Ketterthill","Vos échantillons sont traités par les Laboratoires Ketterthill."],["Résultats","Résultats transmis à vous et à votre médecin selon les délais habituels."]],tech:["Prélèvements sur place","Partenariat Ketterthill","Confidentialité","Prise en charge CNS"],faq:[["Faut-il être patient du cabinet ?","Non, le service de prélèvements est ouvert à tous, sur prescription."],["Faut-il être à jeun ?","Selon les analyses prescrites : votre médecin ou le laboratoire vous le précisera."]]},{slug:"consultations-chirurgie",tag:"Partenaires",title:"Consultations de chirurgie",tagline:"Chirurgie vasculaire et gastrique : des spécialistes à Esch.",img:`${b}/2024/06/rehab_center_devanture-300x169.jpeg`,intro:"Le Rehab Center accueille des consultations spécialisées : chirurgie vasculaire et chirurgie gastrique, assurées par le Dr Pr Moussavian et le Dr Ziemann. Un parcours de soin complet, du diagnostic à la rééducation post-opératoire, au même endroit.",indications:["Chirurgie vasculaire : varices & pathologies veineuses","Pathologies artérielles","Chirurgie gastrique & digestive","Chirurgie de l'obésité (avis spécialisé)","Avis pré-opératoires","Suivi post-opératoire coordonné"],approche:[["Prise de rendez-vous","Consultation sur rendez-vous au sein du Rehab Center."],["Consultation spécialisée","Examen et diagnostic par le Dr Pr Moussavian ou le Dr Ziemann."],["Décision partagée","Explication claire des options, chirurgicales ou non."],["Rééducation intégrée","En cas d'opération, votre rééducation post-opératoire est assurée sur place par nos kinés."]],tech:["Dr Pr Moussavian : chirurgie vasculaire","Dr Ziemann : chirurgie gastrique","Parcours coordonné","Rééducation sur place"],faq:[["Comment prendre rendez-vous ?","Appelez le cabinet au +352 621 667 999 : nous vous orientons vers la consultation adaptée."],["Pourquoi consulter au Rehab Center ?","Diagnostic, chirurgie et rééducation coordonnés au même endroit : un parcours plus simple et plus rapide."]]}],Zu=e=>ar.find(t=>t.slug===e),So=[{slug:"mal-de-dos-exercices-kine",cat:"Dos & posture",title:"Mal de dos : 7 exercices validés par nos kinés pour soulager la lombalgie",desc:"Lombalgie, dos bloqué, douleurs au réveil ? Voici les exercices que nos kinésithérapeutes prescrivent chaque jour au cabinet : et quand consulter à Esch-sur-Alzette.",date:"4 août 2026",read:"6 min",img:`${b}/2024/06/kine_at_work_1-300x225.jpeg`,related:["kinesitherapie-generale","therapie-manuelle"],sections:[{h:"Le mal de dos, première cause de consultation en kinésithérapie",p:["La lombalgie touche près de 8 personnes sur 10 au cours de leur vie. Bonne nouvelle : dans l'immense majorité des cas, elle est dite « commune » : sans gravité : et répond très bien au mouvement. Contrairement à une idée reçue, le repos strict au lit est aujourd'hui déconseillé : c'est l'activité progressive qui accélère la récupération.","Au Rehab Center d'Esch-sur-Alzette, le traitement du mal de dos combine thérapie manuelle pour calmer la douleur et exercices actifs pour renforcer durablement le dos."]},{h:"Les 7 exercices que nos kinés recommandent",p:["1. Le dos creux / dos rond (chat-chameau) : à quatre pattes, alternez lentement 10 fois. Idéal pour redonner de la mobilité au réveil.","2. Le genou-poitrine : allongé sur le dos, ramenez un genou vers la poitrine 30 secondes de chaque côté pour détendre le bas du dos.","3. Le pont fessier : allongé, pieds au sol, décollez le bassin 10 à 15 fois. Renforce fessiers et lombaires, les deux piliers du dos.","4. Le gainage sur les avant-bras : 3 fois 20 à 30 secondes, en gardant le bassin aligné.","5. L'étirement du psoas : en fente au sol, avancez le bassin 30 secondes de chaque côté : précieux si vous travaillez assis.","6. Le « bird-dog » : à quatre pattes, tendez bras et jambe opposés 10 fois de chaque côté, sans creuser le dos.","7. La marche quotidienne : 20 à 30 minutes par jour restent l'un des meilleurs traitements de la lombalgie."]},{h:"Quand consulter un kinésithérapeute ?",p:["Si la douleur persiste au-delà de quelques jours, irradie dans la jambe (sciatique), vous réveille la nuit ou revient régulièrement, un bilan kiné s'impose. Le kinésithérapeute identifie les facteurs d'entretien : raideurs, déficit de force, posture, stress : et construit un programme personnalisé.","Au Luxembourg, les séances sont prises en charge par la CNS sur prescription médicale. Notre équipe vous reçoit du lundi au vendredi de 8h à 21h à Esch-sur-Alzette."]}]},{slug:"entorse-cheville-reeducation",cat:"Kiné du sport",title:"Entorse de cheville : combien de temps pour récupérer, et comment éviter la récidive ?",desc:"Délais de récupération réels, protocole de rééducation étape par étape et critères de reprise du sport : le guide complet de nos kinés du sport.",date:"3 août 2026",read:"7 min",img:`${b}/2024/06/rehab_sport_2-300x225.jpeg`,related:["kine-du-sport","reeducation-post-operatoire"],sections:[{h:"L'entorse de cheville : bénigne… mais pas anodine",p:["C'est la blessure sportive la plus fréquente : et la plus négligée. Jusqu'à 40 % des entorses mal rééduquées évoluent vers une instabilité chronique de la cheville, avec récidives à répétition. La clé n'est pas le repos prolongé, mais une rééducation active et complète.","Les délais indicatifs : entorse légère (grade 1) : 1 à 3 semaines ; entorse moyenne (grade 2) : 3 à 6 semaines ; entorse grave (grade 3, ligament rompu) : 6 à 12 semaines. Ces délais varient selon la prise en charge : d'où l'intérêt de commencer la kiné tôt."]},{h:"Le protocole de rééducation en 4 phases",p:["Phase 1 : Calmer (J0 à J7) : protection relative, mobilisation douce précoce, lutte contre l'œdème (compression, cryothérapie GameReady au cabinet). La marche est reprise dès que possible, souvent avec appui partiel.","Phase 2 : Remobiliser (S1 à S3) : récupération des amplitudes, renforcement progressif des muscles éverseurs, réveil proprioceptif sur plateau instable.","Phase 3 : Renforcer (S3 à S6) : montées sur pointe, travail unipodal, sauts contrôlés. Au Rehab Center, la force est mesurée objectivement sur plateformes VALD ForceDecks pour comparer les deux chevilles.","Phase 4 : Retour au sport : le feu vert ne se donne pas au calendrier mais sur critères : symétrie de force > 90 %, sauts unipodaux indolores, changements de direction maîtrisés."]},{h:"Éviter la récidive",p:["Après une première entorse, le risque de récidive est multiplié par deux. Un programme d'entretien proprioceptif de quelques minutes, 2 à 3 fois par semaine, réduit ce risque de moitié. Nos kinés du sport vous le construisent sur mesure et testent votre cheville avant chaque reprise de saison.","Une entorse récente ou une cheville qui « lâche » régulièrement ? Prenez rendez-vous : bilan chiffré et plan de reprise à la clé."]}]},{slug:"vertiges-vppb-kine-vestibulaire",cat:"Kiné vestibulaire",title:"Vertiges et VPPB : comment la kiné vestibulaire vous en débarrasse, souvent en 1 à 3 séances",desc:"Le vertige positionnel paroxystique bénin (VPPB) est la première cause de vertiges. Manœuvres libératoires, rééducation de l'équilibre : ce qui fonctionne vraiment.",date:"2 août 2026",read:"5 min",img:`${b}/2024/06/rehab_room_13-300x225.jpeg`,related:["kine-vestibulaire","kine-geriatrique"],sections:[{h:"Le VPPB : quand de simples cristaux dérèglent votre équilibre",p:["Vous vous retournez dans le lit et la pièce se met à tourner quelques secondes ? C'est le tableau typique du VPPB : vertige positionnel paroxystique bénin : responsable d'environ un tiers des vertiges. En cause : de microscopiques cristaux (otoconies) déplacés dans les canaux de l'oreille interne.","Bénin ne veut pas dire supportable : le VPPB est anxiogène, augmente le risque de chute et pousse beaucoup de patients à restreindre leurs mouvements : ce qui aggrave le déconditionnement."]},{h:"Les manœuvres libératoires : un traitement spectaculairement efficace",p:["Le traitement de référence est mécanique, pas médicamenteux : des manœuvres de repositionnement (type Epley ou Semont) réalisées par un kinésithérapeute formé en rééducation vestibulaire. Elles guident les cristaux hors du canal semi-circulaire.","Leur efficacité est démontrée : la majorité des VPPB sont résolus en 1 à 3 séances. C'est l'un des traitements les plus « rentables » de toute la kinésithérapie."]},{h:"Et quand ce n'est pas un VPPB ?",p:["Névrite vestibulaire, maladie de Ménière, instabilité chronique, vertiges après commotion : la rééducation vestibulaire propose alors des exercices de stabilisation du regard, d'habituation et d'équilibre, progressifs et personnalisés. Chez les seniors, ce travail réduit significativement le risque de chute.","Au Rehab Center d'Esch-sur-Alzette, le bilan vestibulaire permet d'orienter le traitement dès la première séance, en coordination avec votre médecin ou ORL. Séances remboursées CNS sur prescription."]}]},{slug:"reeducation-lca-retour-sport",cat:"Post-opératoire",title:"Rééducation du ligament croisé (LCA) : les 5 phases du retour au sport, chiffres à l'appui",desc:"De l'opération au retour sur le terrain : durées réelles, étapes clés et tests objectifs qui sécurisent la reprise après une ligamentoplastie du genou.",date:"1 août 2026",read:"8 min",img:`${b}/2024/06/rehab_machine_6-300x225.jpeg`,related:["reeducation-post-operatoire","kine-du-sport"],sections:[{h:"Le LCA : une rééducation qui se gagne sur la durée",p:["La rupture du ligament croisé antérieur est LA blessure redoutée des sportifs. Après ligamentoplastie, la rééducation dure 6 à 12 mois : et sa qualité conditionne directement le risque de re-rupture, qui touche jusqu'à 20 % des sportifs reprenant trop tôt.","Règle d'or validée par la recherche : ne pas reprendre les sports de pivot avant 9 mois, et seulement après validation de tests de force et de saut objectifs."]},{h:"Les 5 phases du protocole",p:["Phase 1 (S0-S4) : Réveil du genou : dégonfler (cryothérapie compressive), retrouver l'extension complète et réveiller le quadriceps.","Phase 2 (M1-M3) : Reconstruction : renforcement progressif, vélo, travail sous BFR (Blood Flow Restriction) qui permet de gagner du muscle sans surcharger le greffon.","Phase 3 (M3-M5) : Force : presse, squats, chaîne postérieure. Objectif : réduire l'asymétrie de force entre les deux jambes, mesurée sur ForceDecks.","Phase 4 (M5-M8) : Course & sauts : réathlétisation, pliométrie, changements de direction progressifs.","Phase 5 (M8-M12) : Return to play : batterie de tests (hop tests, force isométrique, symétrie > 90 %) avant le feu vert, puis réintégration progressive à l'entraînement collectif."]},{h:"Ce qui fait la différence",p:["Les études sont claires : les sportifs qui valident des critères objectifs avant la reprise divisent leur risque de re-blessure. C'est exactement la philosophie du Rehab Center : chaque étape est mesurée (force, symétrie, qualité de saut) sur un plateau technique unique au Luxembourg.","Opéré récemment ou en préparation d'une ligamentoplastie ? La « préhab » (rééducation pré-opératoire) accélère aussi la récupération post-op. Parlez-en à nos kinés du sport."]}]}],Lg=e=>So.find(t=>t.slug===e),wl=[["Algodystrophie (SDRC)","Syndrome douloureux régional complexe survenant parfois après un traumatisme ou une chirurgie ; la kinésithérapie douce et progressive en est un traitement central."],["Amplitude articulaire","Étendue de mouvement d'une articulation, mesurée lors du bilan kiné pour suivre objectivement les progrès."],["Arthrose","Usure progressive du cartilage articulaire (genou, hanche, colonne). L'exercice adapté réduit la douleur et améliore la fonction."],["BFR (Blood Flow Restriction)","Renforcement musculaire sous restriction partielle du flux sanguin : permet de gagner de la force avec de faibles charges, précieux après une chirurgie."],["Bilan kiné","Évaluation initiale (douleur, mobilité, force, fonction) réalisée par le kinésithérapeute pour construire un programme personnalisé."],["Biofeedback","Technique donnant au patient un retour visuel ou sonore sur sa contraction musculaire : utilisée notamment en rééducation périnéale."],["Cervicalgie","Douleur du cou, souvent liée aux postures prolongées ; répond bien à la thérapie manuelle associée aux exercices."],["Chaîne postérieure","Ensemble des muscles de l'arrière du corps (mollets, ischio-jambiers, fessiers, dos), déterminant pour la course et la prévention des blessures."],["CNS (Caisse Nationale de Santé)","Organisme luxembourgeois de sécurité sociale qui rembourse les séances de kinésithérapie prescrites, chez un kiné conventionné comme le Rehab Center."],["Cryothérapie","Utilisation thérapeutique du froid (ex. GameReady) pour réduire douleur et œdème après blessure ou chirurgie."],["Cupping (ventouses)","Technique de thérapie tissulaire par ventouses visant à détendre les tissus et améliorer la circulation locale."],["Déconditionnement","Perte de capacité physique après immobilisation, maladie ou inactivité ; se traite par un reconditionnement progressif à l'effort."],["Dry needling","Technique par fines aiguilles ciblant les points gâchettes musculaires pour lever les tensions douloureuses."],["Écho de force (asymétrie)","Différence de force entre les deux côtés du corps ; une asymétrie > 10 % augmente le risque de blessure au sport."],["Électrothérapie","Courants antalgiques ou excito-moteurs utilisés en complément de la rééducation active."],["Entorse","Étirement ou déchirure d'un ligament (cheville, genou, doigts). La rééducation précoce évite l'instabilité chronique."],["Épicondylite (tennis elbow)","Tendinopathie du coude liée aux gestes répétitifs ; traitée par exercices progressifs et adaptation des charges."],["Équilibre (contrôle postural)","Capacité à maintenir sa stabilité ; se rééduque à tout âge, notamment pour prévenir les chutes des seniors."],["Étirement","Allongement musculaire contrôlé ; utile pour la mobilité, à doser selon l'objectif (échauffement, récupération, raideur)."],["ForceDecks (VALD)","Plateformes de force mesurant objectivement la poussée de chaque jambe, les sauts et les asymétries : utilisées au Rehab Center pour les bilans chiffrés."],["Gainage","Renforcement des muscles profonds du tronc, protecteur du dos et base de la performance sportive."],["Hernie discale","Saillie d'un disque intervertébral pouvant irriter un nerf (sciatique). La grande majorité évolue favorablement avec une rééducation adaptée."],["Hop tests","Batterie de tests de sauts unipodaux validant la reprise du sport après blessure du genou (LCA notamment)."],["Hypopressifs (exercices)","Techniques posturales et respiratoires réduisant la pression abdominale, utilisées en rééducation périnéale."],["Incontinence d'effort","Fuites urinaires lors d'un effort (toux, sport, port de charge) ; la rééducation périnéale en est le traitement de première intention."],["Instabilité chronique de cheville","Sensation de cheville qui « lâche » après des entorses mal rééduquées ; se corrige par renforcement et proprioception."],["Kinésithérapie","Thérapie par le mouvement : discipline de santé qui prévient et traite les troubles du mouvement et de la fonction, sur prescription médicale."],["Kiné du sport","Spécialisation dédiée aux sportifs : traitement des blessures, réathlétisation et retour au sport sur critères objectifs."],["Kiné gériatrique","Kinésithérapie du senior : prévention des chutes, entretien de la force, de l'équilibre et de l'autonomie."],["Kiné périnéale","Rééducation du plancher pelvien (post-partum, incontinence, post-c tape clé de la réathlétisation avant le retour au sport."],["Post-partum (rééducation)","Rééducation périnéale et abdominale après l'accouchement, recommandée à partir de 6 à 8 semaines."],["Posture","Organisation du corps dans l'espace ; il n'existe pas de posture « parfaite », mais des postures variées et de la force."],["Préhab (préhabilitation)","Rééducation avant une chirurgie : arriver plus fort à l'opération accélère la récupération post-opératoire."],["Pressothérapie","Compression pneumatique séquentielle des membres favorisant drainage et récupération."],["Proprioception","Perception inconsciente de la position du corps ; sa rééducation prévient les récidives d'entorse."],["Prothèse (hanche/genou)","Remplacement chirurgical d'une articulation usée ; la rééducation conditionne la qualité du résultat fonctionnel."],["Réathlétisation","Phase intermédiaire entre la rééducation et le retour au sport : reconstruire force, vitesse et confiance."],["Reconditionnement à l'effort","Programme progressif restaurant les capacités cardio-respiratoires et musculaires après maladie ou inactivité."],["Rééducation post-opératoire","Prise en charge kiné après chirurgie (LCA, prothèse, épaule, rachis…) suivant le protocole du chirurgien."],["Renforcement musculaire","Base de la kinésithérapie moderne : un muscle plus fort protège l'articulation et réduit la douleur."],["Return to play","Décision de retour au sport fondée sur des tests objectifs (force, symétrie, sauts) plutôt que sur le seul délai."],["Sciatique","Douleur irradiant du bas du dos vers la jambe le long du nerf sciatique ; évolue favorablement dans la grande majorité des cas."],["Sarcopénie","Perte de masse et de force musculaire liée à l'âge ; se combat efficacement par le renforcement, à tout âge."],["Syndrome du canal carpien","Compression du nerf médian au poignet ; la rééducation de la main accompagne le traitement, avant ou après chirurgie."],["Tendinopathie","Souffrance d'un tendon (épaule, coude, talon d'
